download-external-modules: true

# Composition exceptions for Checkov 3.3.19, the fleet CI version:
# - The private S3 origin is natively multi-AZ; this blueprint does not claim
#   multi-region origin DR or require event notifications with no consumer.
# - CloudFront legacy access logs require an ACL-enabled bucket. The ACL is
#   explicitly private and S3 Block Public Access remains enabled.
# - SSE-S3 is deliberate for the CloudFront origin/log buckets; WAF request
#   logs use a scoped customer-managed KMS key. Origin KMS policy would depend
#   on the distribution ARN and create a key/bucket/distribution cycle.
# - The distribution receives a real us-east-1 ACM certificate, TLSv1.2_2021,
#   and a WAF containing AWSManagedRulesKnownBadInputsRuleSet. Checkov cannot
#   resolve those dynamic values through the external leaf modules.
skip-check:
  - CKV_AWS_310
  - CKV_AWS_192
  - CKV_AWS_174
  - CKV2_AWS_42
  - CKV2_AWS_47
  - CKV2_AWS_62
  - CKV2_AWS_65
  - CKV_AWS_20
  - CKV_AWS_57
  - CKV_AWS_144
  - CKV_AWS_145
