name: terraform-quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: .
            terraform_version: 1.8.5
          - directory: examples/minimal
            terraform_version: 1.7.5
          - directory: examples/complete
            terraform_version: 1.7.5
    uses: hatan4ik/terraform-pipelines/.github/workflows/terraform-quality.yml@8fc2a04c7931dd449097bb92b15b085278e3f67a # v0.1.1
    with:
      working_directory: ${{ matrix.directory }}
      terraform_version: ${{ matrix.terraform_version }}
      check_docs: true

  terraform-floor:
    name: validate on Terraform 1.7.5
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.5
          terraform_wrapper: false

      - name: Initialize and validate
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color
